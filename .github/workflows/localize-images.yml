name: Copy images from Squarespace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/localize_images.py
      - .github/workflows/localize-images.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download images and update pages
        run: python scripts/localize_images.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/site *.html */index.html */*/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Copy site images from Squarespace into the repo"
            git push
          fi
